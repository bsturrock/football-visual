<!doctype html><html><head><style>html,body{margin:0;background:#b9bfc9}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.NeutralToneMapping;r.setScissorTest(true);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color('#b9bfc9');
s.add(new THREE.HemisphereLight('#f2f6ff','#8a8f98',1.8));const d=new THREE.DirectionalLight('#fff',2.2);d.position.set(-2,4,5);s.add(d);
const g=await new GLTFLoader().loadAsync(q.get('f'));const m=g.scene;
const box=new THREE.Box3().setFromObject(m);const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3());
m.position.sub(c);s.add(m);
if(q.has('matte')){
  const pal=[['#1f56d8'],['#f3f5f8'],['#c98a5e'],['#25282f'],['#1a2236']].map(([h])=>new THREE.Color(h));
  const palS=pal.map(c=>c.clone().convertLinearToSRGB());
  m.traverse(o=>{ if(!o.isMesh) return;
    const img=o.material.map.image; const cv=document.createElement('canvas'); cv.width=img.width; cv.height=img.height;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0); const px=cx.getImageData(0,0,cv.width,cv.height).data;
    let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry; const uv=g.attributes.uv, n=g.attributes.position.count;
    const col=new Float32Array(n*3);
    for(let i=0;i<n;i+=3){ let r=0,gg=0,b=0;
      for(let k=0;k<3;k++){ // sample each corner + centroid
        const u=uv.getX(i+k), v=uv.getY(i+k); const x=Math.min(cv.width-1,Math.max(0,Math.floor(u*cv.width))), y=Math.min(cv.height-1,Math.max(0,Math.floor(v*cv.height)));
        const j=(y*cv.width+x)*4; r+=px[j]; gg+=px[j+1]; b+=px[j+2]; }
      r/=765; gg/=765; b/=765;
      let best=0,bd=1e9; palS.forEach((c,ci)=>{const d=(c.r-r)**2*0.8+(c.g-gg)**2+(c.b-b)**2*0.7; if(d<bd){bd=d;best=ci;}});
      const c=pal[best]; for(let k=0;k<3;k++){col[(i+k)*3]=c.r;col[(i+k)*3+1]=c.g;col[(i+k)*3+2]=c.b;}
    }
    g=g.clone(); g.deleteAttribute('uv'); g.deleteAttribute('normal'); g.computeVertexNormals(); g.setAttribute('color',new THREE.BufferAttribute(col,3));
    o.geometry=g; o.material=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});
  });
  s.children.filter(c=>c.isLight).forEach(l=>s.remove(l));
  s.add(new THREE.HemisphereLight('#ffffff','#9aa0aa',2.1)); const k=new THREE.DirectionalLight('#fff8ee',1.6); k.position.set(-2,3,4); s.add(k);
}
if(q.has('styl')){ m.traverse(o=>{ if(o.isMesh){ const mats=Array.isArray(o.material)?o.material:[o.material]; const nm=mats.map(mm=>new THREE.MeshLambertMaterial({color:mm.color,flatShading:true,name:mm.name})); o.material=Array.isArray(o.material)?nm:nm[0]; }});
  s.children.filter(c=>c.isLight).forEach(l=>s.remove(l));
  s.add(new THREE.HemisphereLight('#ffffff','#9aa0aa',2.1)); const k=new THREE.DirectionalLight('#fff8ee',1.6); k.position.set(-2,3,4); s.add(k);}
const wire=q.has('wire');if(wire)m.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:'#ddd',flatShading:true});const w=new THREE.LineSegments(new THREE.WireframeGeometry(o.geometry),new THREE.LineBasicMaterial({color:'#222'}));o.add(w);}});
const views=q.get('cam')==='head'?[[0,0.1],[0.5,0.1],[-0.5,0.1],[0.3,0.3]]:[[0,0],[Math.PI/2,0],[Math.PI,0],[0.6,0.25]];if(q.get('cam')==='head'){m.position.y-=sz.y*0.4;} // cam=head
const R=Math.max(sz.x,sz.y)*(q.get("zoom")?+q.get("zoom"):1.9);
views.forEach(([a,e],i)=>{const cam=new THREE.PerspectiveCamera(30,(W/4)/H,0.01,100);cam.position.set(Math.sin(a)*R*Math.cos(e),Math.sin(e)*R,Math.cos(a)*R*Math.cos(e));cam.lookAt(0,0,0);r.setViewport(i*W/4,0,W/4,H);r.setScissor(i*W/4,0,W/4,H);r.render(s,cam);});
document.title='done '+JSON.stringify(sz.toArray().map(v=>v.toFixed(3)));
</script></body></html>
