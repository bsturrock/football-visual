<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Player lineup</title>
<style>
  html, body { margin: 0; height: 100%; background: #a9afba; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(20, 24, 32, .82); color: #eef; padding: 10px 12px; border-radius: 8px; width: 250px; }
  #ui label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; gap: 8px; }
  #ui input[type=range] { width: 120px; }
  #ui select, #ui input[type=number] { width: 124px; }
  #ui .row { display: flex; gap: 6px; margin-top: 6px; }
  #ui button { flex: 1; }
  #ui h3 { margin: 4px 0 6px; font-size: 13px; }
  #info { position: absolute; bottom: 10px; left: 10px; color: #111; font-size: 12px; white-space: pre; }
  body.capture #ui, body.capture #info { display: none; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
</head>
<body>
<div id="ui">
  <h3>View</h3>
  <label>Lineup <select id="view">
    <option value="test">6 test players</option>
    <option value="seeds">Same size, 3 seeds</option>
    <option value="custom">Custom</option>
  </select></label>
  <label>Pose <select id="pose">
    <option>idle</option><option>run</option><option>sprint</option><option>backpedal</option><option>shuffle</option>
    <option>3pt</option><option>2pt</option><option>wr</option><option>block</option><option>tpose</option>
  </select></label>
  <label>Camera <select id="cam"><option>3q</option><option>front</option><option>side</option><option>back</option></select></label>
  <label>Uniform <select id="uniform"><option>home</option><option>away</option><option>alt</option></select></label>
  <div id="custom">
    <h3>Custom player</h3>
    <label>Position <select id="position"></select></label>
    <label>Height <input id="height" type="range" min="67" max="81" step="0.5"><span id="heightV"></span></label>
    <label>Weight <input id="weight" type="range" min="160" max="380" step="1"><span id="weightV"></span></label>
    <label>Seed <input id="seed" type="number"></label>
    <div class="row"><button id="rand">Randomize</button><button id="reset">Reset to base</button></div>
  </div>
</div>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { createPlayerRig, disposeRig } from './src/engine/PlayerModel.js';
import { resolveBody, POSITION_ARCHETYPE } from './src/engine/Body.js';
import { resolveKit } from './src/engine/Uniforms.js';
import { Animator } from './src/engine/Animator.js';
import { DEFAULT_TEAMS } from './src/engine/Engine.js';
import { SKIN_TONES } from './src/engine/constants.js';

const q = new URLSearchParams(location.search);
if (q.has('capture')) document.body.classList.add('capture');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9afba');
scene.add(new THREE.HemisphereLight('#f4f7ff', '#8a8f98', 1.9));
const sun = new THREE.DirectionalLight('#fffaf0', 2.2);
sun.position.set(-4, 8, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 6, bottom: -2 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#b9bec8' }));
ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 200);

// --- state ------------------------------------------------------------------
const $ = id => document.getElementById(id);
for (const p of Object.keys(POSITION_ARCHETYPE)) $('position').add(new Option(p, p));
const state = {
  view: q.get('view') || 'test', pose: q.get('pose') || 'idle', cam: q.get('cam') || '3q', uniform: q.get('uniform') || 'home',
  position: q.get('position') || 'LB', height: +(q.get('h') || 74), weight: +(q.get('w') || 245), seed: +(q.get('seed') || 17429),
};
for (const k of ['view', 'pose', 'cam', 'uniform', 'position']) $(k).value = state[k];
$('height').value = state.height; $('weight').value = state.weight; $('seed').value = state.seed;

const TESTS = [
  { label: "RB 5'8\" 195", position: 'RB', heightIn: 68, weightLb: 195, seed: 11 },
  { label: "WR 6'1\" 195", position: 'WR', heightIn: 73, weightLb: 195, seed: 12 },
  { label: "QB 6'4\" 225", position: 'QB', heightIn: 76, weightLb: 225, seed: 13 },
  { label: "LB 6'2\" 245", position: 'LB', heightIn: 74, weightLb: 245, seed: 14 },
  { label: "DE 6'5\" 270", position: 'DE', heightIn: 77, weightLb: 270, seed: 15 },
  { label: "OT 6'6\" 325", position: 'OT', heightIn: 78, weightLb: 325, seed: 16 },
];
const NUMS = { QB: 12, RB: 28, WR: 84, TE: 87, OL: 72, OT: 76, OG: 64, C: 55, DL: 93, DT: 98, DE: 91, LB: 54, CB: 24, S: 31, K: 3, P: 8, FB: 44 };

let players = [];
function fakePlayer(rig) {
  return {
    rig, vel: new THREE.Vector2(), facing: 0, state: 'up', intent: { type: 'idle' }, crouch: 0, accelLocal: 0,
    action: null, hasBall: false, lookAt: null, reachTarget: null, upper: null, fallDir: new THREE.Vector2(1, 0), fallAngle: 0,
  };
}

function build() {
  for (const p of players) { scene.remove(p.rig.root); disposeRig(p.rig); }
  players = [];
  const team = { ...DEFAULT_TEAMS.home };
  const kit = resolveKit(team, state.uniform);
  let specs;
  if (state.view === 'test') specs = TESTS;
  else if (state.view === 'seeds') specs = [1, 2, 3].map(i => ({ label: `LB 6'2" 245 seed ${state.seed + i}`, position: 'LB', heightIn: 74, weightLb: 245, seed: state.seed + i }));
  else specs = [{ label: 'custom', position: state.position, heightIn: state.height, weightLb: state.weight, seed: state.seed }];
  const gap = 1.25;
  specs.forEach((s, i) => {
    const body = resolveBody(s);
    const skin = SKIN_TONES[(s.seed * 7 + i * 3) % SKIN_TONES.length];
    const rig = createPlayerRig({ body, kit, skin, number: NUMS[s.position] ?? 0, name: 'Player' });
    rig.root.position.x = (i - (specs.length - 1) / 2) * gap;
    scene.add(rig.root);
    const fp = fakePlayer(rig);
    const anim = new Animator(fp);
    anim.phase = i * 0.9;
    players.push({ rig, fp, anim, spec: s, body });
  });
  $('custom').style.display = state.view === 'custom' ? '' : 'none';
  $('info').textContent = players.map(p => `${p.spec.label}  →  ${p.body.archetype}, ${(p.rig.dims.Hy * 36).toFixed(1)} in`).join('\n');
  placeCamera(specs.length * gap);
}

function placeCamera(width) {
  const d = Math.max(6.5, width * 1.35 + 2.5) * +(q.get('zoom') || 1);
  const a = { '3q': 0.5, front: 0, side: Math.PI / 2, back: Math.PI }[state.cam];
  camera.position.set(Math.sin(a) * d, 1.25, Math.cos(a) * d);
  camera.lookAt(0, 1.02, 0);
}

function applyPose(p, dt) {
  const fp = p.fp, pose = state.pose;
  fp.intent = { type: 'idle' }; fp.upper = null; fp.vel.set(0, 0); fp.crouch = 0;
  if (pose === 'run') fp.vel.set(0, 6.5);
  if (pose === 'sprint') fp.vel.set(0, 9.5);
  if (pose === 'backpedal') fp.vel.set(0, -4.5);
  if (pose === 'shuffle') fp.vel.set(3.5, 0);
  if (['3pt', '2pt', 'wr'].includes(pose)) fp.intent = { type: 'stance', kind: pose };
  if (pose === 'block') { fp.upper = 'block'; fp.crouch = 0.35; }
  if (pose === 'tpose') {
    for (const b of Object.values(p.rig.bones)) b.rotation.set(0, 0, 0);
    p.rig.bones.shL.rotation.z = Math.PI / 2; p.rig.bones.shR.rotation.z = -Math.PI / 2;
    p.rig.bones.pelvis.position.y = p.rig.leg.FOOT_H + p.rig.leg.SHIN + p.rig.leg.THIGH - p.rig.leg.HIP_Y;
    return;
  }
  p.anim.update(dt);
}

for (const k of ['view', 'pose', 'cam', 'uniform', 'position']) $(k).onchange = () => { state[k] = $(k).value; build(); };
for (const k of ['height', 'weight']) $(k).oninput = () => { state[k] = +$(k).value; label(); build(); };
$('seed').onchange = () => { state.seed = +$('seed').value; build(); };
$('rand').onclick = () => { state.seed = (Math.random() * 1e6) | 0; $('seed').value = state.seed; build(); };
$('reset').onclick = () => { Object.assign(state, { position: 'QB', height: 73, weight: 225 }); $('position').value = 'QB'; $('height').value = 73; $('weight').value = 225; label(); build(); };
function label() {
  $('heightV').textContent = `${Math.floor(state.height / 12)}'${(state.height % 12).toFixed(state.height % 1 ? 1 : 0)}"`;
  $('weightV').textContent = `${state.weight} lb`;
}
label();
build();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// fixed-step animation so headless captures are deterministic
const fixed = q.has('capture');
let last = performance.now();
if (fixed) for (let i = 0; i < 90; i++) for (const p of players) applyPose(p, 1 / 60);
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = fixed ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
  if (!fixed) for (const p of players) applyPose(p, dt);
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
